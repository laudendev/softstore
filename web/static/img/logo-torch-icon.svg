<svg width="135.46667" height="135.46667" viewBox="0 0 135.46667 135.46667" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="fire-turb" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" seed="4" result="noise">
                <animate attributeName="baseFrequency" dur="3s" values="0.02 0.06; 0.03 0.08; 0.02 0.06" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <radialGradient id="flame-grad" cx="50%" cy="75%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="45%" stop-color="#DCEBFF"/>
            <stop offset="100%" stop-color="#93C5FD"/>
        </radialGradient>
    </defs>

    <rect x="0" y="0" width="135.46667" height="135.46667" rx="20" fill="#3B82F6"/>

    <!-- Wooden handle, tapered -->
    <path fill="#FFFFFF" d="M 61 124 L 63 82 L 72.5 82 L 74.5 124 Z"/>
    <!-- Cloth binding wraps -->
    <rect x="59.5" y="76" width="16.5" height="4.5" rx="1.5" fill="#BFE0FF"/>
    <rect x="60.5" y="83" width="14.5" height="4.5" rx="1.5" fill="#BFE0FF"/>

    <!-- Flame: teardrop shape distorted by animated turbulence, plus glow -->
    <g filter="url(#soft-glow)">
        <path filter="url(#fire-turb)" fill="url(#flame-grad)"
              d="M 67.5 22
                 C 84 40 86 56 78 70
                 C 74 78 60 78 57 70
                 C 49 56 51 40 67.5 22 Z"/>
    </g>
</svg>
