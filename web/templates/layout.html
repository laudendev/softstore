{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{.Title}} | lauden.dev</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon-dark.svg" media="(prefers-color-scheme: dark)">

	<link rel="stylesheet" href="/static/css/style.css">
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
	<header>
		<a href="/">
			<picture>
				<source srcset="/static/img/logo-dark.svg" media="(prefers-color-scheme: dark)">
				<img src="/static/img/logo.svg" alt="lauden.dev" class="logo">
			</picture>
		</a>
	</header>
	<main id="content">
		{{template "content" .}}
	</main>
    <footer>
        <p>&copy; 2026 Tyler L. Laudenslager. All rights reserved.</p>
    </footer>
</body>
</html>
{{end}}
