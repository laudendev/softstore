{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
	<title>{{.Title}} | lauden.dev</title>
	<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" media="(prefers-color-scheme: light)">
	<link rel="icon" type="image/svg+xml" href="/static/img/favicon-dark.svg" media="(prefers-color-scheme: dark)">
	<link rel="stylesheet" href="/static/css/style.css">
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

    <div class="beta-badge-wrap"><div class="beta-badge">Beta - shop, checkout, get license by email. See it work!</div></div>
    <header>
		<a href="/">
			<picture>
				<source srcset="/static/img/logo-dark.svg" media="(prefers-color-scheme: dark)">
				<img src="/static/img/logo.svg" alt="lauden.dev" class="logo">
			</picture>
		</a>
    </header>
	<button
		type="button"
		class="cart-link"
		aria-label="Cart"
		hx-get="/cart"
		hx-target="#cart-drawer-content"
		hx-swap="innerHTML"
		hx-on::after-request="document.getElementById('cart-drawer').classList.add('open')"
	>
		<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
			<path d="M3 6h18"/>
			<path d="M16 10a4 4 0 0 1-8 0"/>
		</svg>
        <span id="cart-count" class="cart-count-badge">{{.CartCount}}</span>
	</button>
        <div id="cart-drawer-overlay" class="cart-drawer-overlay" onclick="document.getElementById('cart-drawer').classList.remove('open')"></div>
	<div id="cart-drawer" class="cart-drawer">
		<div id="cart-drawer-content"></div>
	</div>
	<main id="content">
		{{template "content" .}}
	</main>
	<footer>
        <p>&copy; 2026 Laudenslager Software, LLC. <a href="https://lauden.dev">lauden.dev</a></p>
        <p class="footer-legal-links">
			<a href="/legal/terms">Terms</a> ·
			<a href="/legal/privacy">Privacy</a> ·
			<a href="/legal/eula">EULA</a> ·
			<a href="/legal/refunds">Refunds</a> ·
			<a href="/legal/cookies">Cookies</a>
		</p>
	</footer>

<script>
// Volume discount tiers, mirroring internal/handlers/product_pricing.go's
// deviceDiscountTiers — kept in sync manually since this is a small,
// stable pricing table, not worth a server round-trip just to preview.
function softstoreDiscountForSeats(seats) {
	if (seats <= 1) return 0;
	if (seats === 2) return 0.10;
	if (seats <= 4) return 0.15;
	return 0.20; // 5-6
}

function softstoreStepSeats(slug, delta) {
	const display = document.getElementById('seats-' + slug);
	let seats = parseInt(display.dataset.seats, 10) || 1;
	seats += delta;
	if (seats > 6) seats = 1;
	if (seats < 1) seats = 6;
	display.dataset.seats = seats;
	display.textContent = seats + (seats === 1 ? ' device' : ' devices');

    const picker = display.closest('.seat-picker');
	const basePriceCents = parseInt(picker.dataset.basePrice, 10);
	const priceEl = document.getElementById('price-' + slug);

	if (seats === 1) {
        priceEl.textContent = '$' + priceEl.dataset.basePriceDollars;
		return;
	}
	const discount = softstoreDiscountForSeats(seats);
	const perDevice = basePriceCents * (1 - discount);
	const total = (perDevice * seats) / 100;
	const discountPct = Math.round(discount * 100);
	priceEl.textContent = '$' + total.toFixed(2) + (discountPct > 0 ? ' (' + discountPct + '% off)' : '');
}
</script>
</body>
</html>
{{end}}
