{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
	<title>{{.Title}} | lauden.dev</title>
	<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" media="(prefers-color-scheme: light)">
	<link rel="icon" type="image/svg+xml" href="/static/img/favicon-dark.svg" media="(prefers-color-scheme: dark)">
	<link rel="stylesheet" href="/static/css/style.css">
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

    <div class="beta-badge-wrap"><div class="beta-badge">Beta - shop, checkout, get license by email. See it work!</div></div>
    <header>
		<a href="/">
			<picture>
				<source srcset="/static/img/logo-dark.svg" media="(prefers-color-scheme: dark)">
				<img src="/static/img/logo.svg" alt="lauden.dev" class="logo">
			</picture>
		</a>
    </header>
    {{if .ShowCart}}
	<button
		type="button"
		class="cart-link"
		aria-label="Cart"
		hx-get="/cart"
		hx-target="#cart-drawer-content"
		hx-swap="innerHTML"
		hx-on::after-request="document.getElementById('cart-drawer').classList.add('open')"
	>
		<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
			<path d="M3 6h18"/>
			<path d="M16 10a4 4 0 0 1-8 0"/>
		</svg>
        <span id="cart-count" class="cart-count-badge">{{.CartCount}}</span>
	</button>
        <div id="cart-drawer-overlay" class="cart-drawer-overlay" onclick="document.getElementById('cart-drawer').classList.remove('open')"></div>
	<div id="cart-drawer" class="cart-drawer">
		<div id="cart-drawer-content"></div>
	</div>
    {{end}}
	<main id="content">
		{{template "content" .}}
	</main>
	<footer>
		<p>&copy; 2026 Laudenslager Software, LLC. lauden.dev</p>
        <p class="footer-legal-links">
			<a href="/legal/terms">Terms</a> ·
			<a href="/legal/privacy">Privacy</a> ·
			<a href="/legal/eula">EULA</a> ·
			<a href="/legal/refunds">Refunds</a> ·
			<a href="/legal/cookies">Cookies</a>
		</p>
	</footer>
</body>
</html>
{{end}}
