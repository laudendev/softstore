{{define "content"}}
<section>
	<h2>Software</h2>
	<div id="product-list">
		{{if .Products}}
			{{range .Products}}
			<article class="product">
				<h3>{{.Name}}</h3>
				<p>{{.Description}}</p>
				<p class="price">${{.PriceDollars}}</p>
			</article>
			{{end}}
		{{else}}
			<p>No products yet.</p>
		{{end}}
	</div>
</section>
{{end}}
